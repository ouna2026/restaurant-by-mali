<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes Messages - Restaurant By Mali</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Arial, sans-serif
        }

        body {
            background: #FFF8EE;
            color: #1A1512;
            overflow-x: hidden
        }

        .header {
            background: #1A1512;
            color: #fff;
            padding: 22px 20px;
            text-align: center
        }

        .header h1 {
            font-family: Georgia, serif;
            font-size: 22px;
            font-weight: 400
        }

        .header p {
            font-size: 13px;
            opacity: .85;
            margin-top: 4px
        }

        .nav {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            padding: 14px 20px;
            justify-content: center
        }

        .nav a {
            background: #fff;
            border: 1px solid #F1E3C8;
            padding: 9px 14px;
            border-radius: 20px;
            text-decoration: none;
            color: #1A1512;
            font-size: 13px;
            font-weight: 700;
            white-space: nowrap
        }

        .nav a.corbeille {
            background: #7A0C1A;
            color: #fff;
            border-color: #7A0C1A
        }

        .main {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 16px 30px
        }

        .card {
            background: #fff;
            border: 1px solid #F1E3C8;
            border-radius: 16px;
            padding: 18px;
            margin-top: 14px;
            overflow: hidden
        }

        .msg {
            display: flex;
            gap: 12px;
            align-items: flex-start;
            border-bottom: 1px solid #F1E3C8;
            padding: 14px 0
        }

        .msg:last-child {
            border-bottom: none
        }

        .msg img {
            width: 70px;
            height: 70px;
            object-fit: cover;
            border-radius: 12px;
            flex-shrink: 0
        }

        .msg .texte {
            flex: 1;
            min-width: 0;
            word-break: break-word;
            font-size: 13px;
            line-height: 1.7
        }

        .msg .texte b {
            font-size: 14px
        }

        .check {
            width: 22px;
            height: 22px;
            flex-shrink: 0;
            margin-top: 4px;
            accent-color: #7A0C1A;
            cursor: pointer
        }

        .badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 800;
            white-space: nowrap
        }

        .badge-vert {
            background: #1B6B2E;
            color: #fff
        }

        .badge-rouge {
            background: #A83200;
            color: #fff
        }

        .badge-or {
            background: #C9A227;
            color: #1A1512
        }

        .btn-bordeaux {
            background: #7A0C1A;
            color: #fff;
            border: none;
            padding: 13px;
            border-radius: 12px;
            font-weight: 800;
            cursor: pointer;
            font-size: 14px;
            width: 100%;
            margin-top: 10px
        }

        .btn-bordeaux-clair {
            background: #fff;
            color: #7A0C1A;
            border: 2px solid #7A0C1A;
            padding: 12px;
            border-radius: 12px;
            font-weight: 800;
            cursor: pointer;
            font-size: 14px;
            width: 100%;
            margin-top: 10px
        }

        .btn-noir {
            background: #1A1512;
            color: #fff;
            border: none;
            padding: 13px;
            border-radius: 12px;
            font-weight: 800;
            cursor: pointer;
            font-size: 14px;
            width: 100%;
            margin-top: 10px
        }

        .vide {
            text-align: center;
            color: #888;
            font-size: 14px;
            padding: 20px
        }

        .bar-suppr {
            display: flex;
            gap: 10px;
            flex-wrap: wrap
        }

        .bar-suppr .btn-bordeaux,
        .bar-suppr .btn-bordeaux-clair {
            flex: 1;
            min-width: 160px
        }

        @media print {

            .nav,
            .btn-bordeaux,
            .btn-bordeaux-clair,
            .btn-noir,
            .check {
                display: none !important
            }
        }
    </style>
</head>

<body>
    <div class="header">
        <h1 id="titreNom">Mes Messages</h1>
        <p>Messages de tes restaurants. Coche pour supprimer.</p>
    </div>
    <div class="nav">
        <a href="accueil.html">Accueil</a>
        <a href="commandes.html">Mes Commandes</a>
        <a href="ia.html">IA Müna</a>
        <a href="jeux.html">Jeux</a>
        <a href="profil.html">Profil</a>
        <a href="message.html">Messages</a>
        <a href="corbeille.html" class="corbeille">🗑 Corbeille</a>
        <a href="login.html" onclick="localStorage.removeItem('rbm_client_connecte')">Se déconnecter</a>
    </div>
    <div class="main">
        <div class="card">
            <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
                <h3 style="font-family:Georgia,serif;font-weight:400">Messages reçus</h3>
                <label style="font-size:13px;font-weight:700;cursor:pointer"><input type="checkbox" id="toutCocher"
                        onchange="toutCocher()"
                        style="accent-color:#7A0C1A;width:18px;height:18px;vertical-align:middle"> Tout cocher</label>
            </div>
            <div id="liste"></div>
            <div class="bar-suppr">
                <button class="btn-bordeaux-clair" onclick="supprimerSelection()">🗑 Supprimer le message
                    sélectionné</button>
                <button class="btn-bordeaux" onclick="supprimerTout()">🗑 Supprimer tous les messages</button>
            </div>
            <button class="btn-noir" onclick="window.print()">🖨 IMPRIMER</button>
            <p id="msgInfo" style="font-size:13px;text-align:center;margin-top:10px;color:#7A0C1A;font-weight:700"></p>
            <p style="font-size:12px;text-align:center;color:#888;margin-top:6px">Supprimer = envoie en Corbeille. Tu
                peux restaurer dans Corbeille.</p>
        </div>
    </div>
    <script>
        let client = localStorage.getItem("rbm_client_connecte") || "";
        if (!client) location.href = "login.html";
        document.getElementById("titreNom").textContent = "Messages — " + client;
        function propre(v) {
            if (!v) return "—";
            v = String(v).trim();
            if (v.charAt(0) === "{") {
                try { let o = JSON.parse(v); if (o.nom) return o.nom; } catch (e) { }
                let m = v.match(/"nom"\s*:\s*"([^"]+)"/); if (m) return m[1];
                return "—";
            }
            return v;
        }
        function getMessages() { try { return JSON.parse(localStorage.getItem("rbm_messages") || "[]"); } catch (e) { return []; } }
        function mesMessages() {
            let tous = getMessages();
            let res = [];
            tous.forEach(function (m, i) {
                let pour = m.pour || m.pourNom || m.client || "";
                let pourNom = m.pourNom || m.pour || "";
                if (String(pour) === String(client) || String(pourNom) === String(client) || propre(pour) === client || propre(pourNom) === client) {
                    res.push({ m: m, idx: i });
                }
            });
            return res;
        }
        function afficher() {
            let liste = mesMessages();
            liste.sort(function (a, b) { return new Date(b.m.date || 0) - new Date(a.m.date || 0); });
            let zone = document.getElementById("liste");
            if (liste.length === 0) {
                zone.innerHTML = "<div class='vide'>Aucun message pour le moment.</div>";
                return;
            }
            zone.innerHTML = liste.map(function (obj) {
                let m = obj.m;
                let type = m.type || "Message";
                let badge = type.indexOf("échoué") !== -1 || type.indexOf("Échoué") !== -1 ? "badge-rouge" : (type.indexOf("reçu") !== -1 || type.indexOf("validée") !== -1 || type.indexOf("Validée") !== -1 ? "badge-vert" : "badge-or");
                let img = (m.img && m.img.length > 10) ? m.img : "https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=300&h=300&fit=crop";
                return "<div class='msg'><input type='checkbox' class='check' data-idx='" + obj.idx + "'><img src='" + img + "' onerror=\"this.src='https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=300&h=300&fit=crop'\"><div class='texte'><b>" + propre(m.restaurant || m.de || "Restaurant") + "</b> — <span class='badge " + badge + "'>" + type + "</span><br>" + (m.texte || "") + "<br><small style='color:#888'>Plat : " + propre(m.plat || "") + " — " + (m.total || "") + " F — " + (m.date || "") + "</small></div></div>";
            }).join("");
            let tous = getMessages();
            let aChange = false;
            liste.forEach(function (obj) { if (tous[obj.idx] && !tous[obj.idx].lu) { tous[obj.idx].lu = true; aChange = true; } });
            if (aChange) localStorage.setItem("rbm_messages", JSON.stringify(tous));
        }
        afficher();
        function toutCocher() {
            let coche = document.getElementById("toutCocher").checked;
            document.querySelectorAll(".check").forEach(function (c) { c.checked = coche; });
        }
        // ===== ENVOIE EN CORBEILLE, PAS EFFACÉ POUR TOUJOURS =====
        function envoyerEnCorbeille(original) {
            let corb = [];
            try { corb = JSON.parse(localStorage.getItem("rbm_corbeille") || "[]"); } catch (e) { corb = []; }
            corb.push({ dossier: "client", pour: original.pour, pourNom: original.pourNom, de: original.de, restaurant: original.restaurant, type: original.type, texte: original.texte, plat: original.plat, img: original.img, total: original.total, date: original.date, dateSuppression: new Date().toLocaleString("fr-FR"), original: original });
            localStorage.setItem("rbm_corbeille", JSON.stringify(corb));
        }
        function supprimerSelection() {
            let coches = Array.from(document.querySelectorAll(".check:checked"));
            if (coches.length === 0) { document.getElementById("msgInfo").textContent = "Coche d'abord le message à supprimer."; return; }
            if (!confirm("Mettre " + coches.length + " message(s) en Corbeille ?")) return;
            let tous = getMessages();
            let aSupprimer = coches.map(function (c) { return parseInt(c.getAttribute("data-idx")); }).sort(function (a, b) { return b - a; });
            aSupprimer.forEach(function (i) { envoyerEnCorbeille(tous[i]); tous.splice(i, 1); });
            localStorage.setItem("rbm_messages", JSON.stringify(tous));
            document.getElementById("toutCocher").checked = false;
            document.getElementById("msgInfo").textContent = "Envoyé en Corbeille. Va dans Corbeille pour restaurer.";
            afficher();
        }
        function supprimerTout() {
            let liste = mesMessages();
            if (liste.length === 0) { document.getElementById("msgInfo").textContent = "Aucun message à supprimer."; return; }
            if (!confirm("Mettre TOUS tes " + liste.length + " messages en Corbeille ?")) return;
            let tous = getMessages();
            let aSupprimer = liste.map(function (o) { return o.idx; }).sort(function (a, b) { return b - a; });
            aSupprimer.forEach(function (i) { envoyerEnCorbeille(tous[i]); tous.splice(i, 1); });
            localStorage.setItem("rbm_messages", JSON.stringify(tous));
            document.getElementById("toutCocher").checked = false;
            document.getElementById("msgInfo").textContent = "Tous envoyés en Corbeille.";
            afficher();
        }
    </script>
</body>

</html>
