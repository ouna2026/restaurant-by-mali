<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corbeille Admin - Restaurant By Mali</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Arial, sans-serif
        }

        body {
            background: #FFF8EE;
            color: #1A1512;
            overflow-x: hidden
        }

        .header {
            background: #1A1512;
            color: #fff;
            padding: 22px 20px;
            text-align: center
        }

        .header h1 {
            font-family: Georgia, serif;
            font-size: 22px;
            font-weight: 400
        }

        .header p {
            font-size: 13px;
            opacity: .85;
            margin-top: 4px
        }

        .nav {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            padding: 14px 20px;
            justify-content: center
        }

        .nav a {
            background: #fff;
            border: 1px solid #F1E3C8;
            padding: 9px 14px;
            border-radius: 20px;
            text-decoration: none;
            color: #1A1512;
            font-size: 13px;
            font-weight: 700;
            white-space: nowrap
        }

        .main {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 16px 30px
        }

        .card {
            background: #fff;
            border: 1px solid #F1E3C8;
            border-radius: 16px;
            padding: 18px;
            margin-top: 14px;
            overflow: hidden
        }

        .msg {
            display: flex;
            gap: 12px;
            align-items: flex-start;
            border-bottom: 1px solid #F1E3C8;
            padding: 14px 0
        }

        .msg:last-child {
            border-bottom: none
        }

        .msg img {
            width: 70px;
            height: 70px;
            object-fit: cover;
            border-radius: 12px;
            flex-shrink: 0
        }

        .msg .texte {
            flex: 1;
            min-width: 0;
            word-break: break-word;
            font-size: 13px;
            line-height: 1.7
        }

        .badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 800;
            white-space: nowrap
        }

        .badge-vert {
            background: #1B6B2E;
            color: #fff
        }

        .badge-rouge {
            background: #A83200;
            color: #fff
        }

        .badge-or {
            background: #C9A227;
            color: #1A1512
        }

        .badge-noir {
            background: #1A1512;
            color: #fff
        }

        .btn-bordeaux {
            background: #7A0C1A;
            color: #fff;
            border: none;
            padding: 13px;
            border-radius: 12px;
            font-weight: 800;
            cursor: pointer;
            font-size: 14px;
            width: 100%;
            margin-top: 10px
        }

        .btn-bordeaux-clair {
            background: #fff;
            color: #7A0C1A;
            border: 2px solid #7A0C1A;
            padding: 12px;
            border-radius: 12px;
            font-weight: 800;
            cursor: pointer;
            font-size: 13px;
            margin-top: 8px
        }

        .btn-vert {
            background: #1B6B2E;
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-weight: 800;
            cursor: pointer;
            font-size: 13px;
            margin-top: 8px
        }

        .btn-noir {
            background: #1A1512;
            color: #fff;
            border: none;
            padding: 13px;
            border-radius: 12px;
            font-weight: 800;
            cursor: pointer;
            font-size: 14px;
            width: 100%;
            margin-top: 10px
        }

        .vide {
            text-align: center;
            color: #888;
            font-size: 14px;
            padding: 20px
        }

        .ligne-btn {
            display: flex;
            gap: 10px;
            flex-wrap: wrap
        }

        .ligne-btn button {
            flex: 1;
            min-width: 140px
        }

        select {
            padding: 10px;
            border: 1.5px solid #F1E3C8;
            border-radius: 10px;
            font-size: 14px;
            margin-top: 10px;
            width: 100%
        }

        @media print {

            .nav,
            .btn-bordeaux,
            .btn-bordeaux-clair,
            .btn-vert,
            .btn-noir {
                display: none !important
            }
        }
    </style>
</head>

<body>
    <div class="header">
        <h1>Corbeille — Admin</h1>
        <p>Surveillance : tout ce qui a été supprimé par Client et Restaurant.</p>
    </div>
    <div class="nav">
        <a href="dashboard.html">Tableau de bord</a>
        <a href="notifications-paiements.html">Notifications Paiements</a>
        <a href="notifications-utlisateurs.html">Notifications Utilisateurs</a>
        <a href="finance-paiement.html">Finance</a>
        <a href="corbeille.html">Corbeille</a>
    </div>
    <div class="main">
        <div class="card">
            <h3 style="font-family:Georgia,serif;font-weight:400">Corbeille Admin — <span id="nb">0</span> éléments</h3>
            <label style="font-size:12px;font-weight:800;color:#888">FILTRER PAR DOSSIER</label>
            <select id="filtre" onchange="afficher()">
                <option value="tous">Tous — Client + Restaurant + Admin</option>
                <option value="client">Client seulement</option>
                <option value="restaurant">Restaurant seulement</option>
                <option value="admin">Admin seulement</option>
            </select>
            <div id="liste"></div>
            <button class="btn-bordeaux" onclick="viderCorbeille()">🗑 Vider toute la corbeille — Tout supprimer
                définitivement</button>
            <p id="msgInfo" style="font-size:13px;text-align:center;margin-top:10px;color:#7A0C1A;font-weight:700"></p>
        </div>
    </div>
    <script>
        function propre(v) {
            if (!v) return "—";
            v = String(v).trim();
            if (v.charAt(0) === "{") {
                try { let o = JSON.parse(v); if (o.nom) return o.nom; } catch (e) { }
                let m = v.match(/"nom"\s*:\s*"([^"]+)"/); if (m) return m[1];
                return "—";
            }
            return v;
        }
        function getCorbeille() { try { return JSON.parse(localStorage.getItem("rbm_corbeille") || "[]"); } catch (e) { return []; } }
        function setCorbeille(a) { localStorage.setItem("rbm_corbeille", JSON.stringify(a)); }
        function afficher() {
            let filtre = document.getElementById("filtre").value;
            let tous = getCorbeille();
            let liste = [];
            tous.forEach(function (item, i) {
                if (filtre === "tous" || item.dossier === filtre) liste.push({ item: item, idx: i });
            });
            document.getElementById("nb").textContent = liste.length;
            let zone = document.getElementById("liste");
            if (liste.length === 0) {
                zone.innerHTML = "<div class='vide'>Corbeille vide.</div>";
                return;
            }
            zone.innerHTML = liste.map(function (obj) {
                let m = obj.item;
                let badgeDossier = m.dossier === "client" ? "badge-noir" : (m.dossier === "restaurant" ? "badge-or" : "badge-rouge");
                let img = (m.img && m.img.length > 10) ? m.img : "https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=300&h=300&fit=crop";
                return "<div class='msg'><img src='" + img + "' onerror=\"this.src='https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=300&h=300&fit=crop'\"><div class='texte'><b>" + propre(m.client || m.pour || "—") + " — " + propre(m.plat || m.commande || m.type || "Message") + "</b> — <span class='badge " + badgeDossier + "'>" + (m.dossier || "—").toUpperCase() + "</span><br>Restaurant : " + propre(m.restaurant || m.de || "—") + " — Montant : <b>" + (m.total || m.prix || "—") + " F</b><br><small>" + (m.texte || "") + "</small><br><small style='color:#888'>Supprimé le : " + (m.dateSuppression || "—") + " — Date d'origine : " + (m.date || "—") + "</small><div class='ligne-btn'><button class='btn-vert' onclick='restaurer(" + obj.idx + ")'>↩ Restaurer</button><button class='btn-bordeaux-clair' onclick='supprimerDefinitif(" + obj.idx + ")'>🗑 Supprimer définitivement</button></div></div></div>";
            }).join("");
        }
        afficher();
        function restaurer(idx) {
            let tous = getCorbeille();
            let item = tous[idx];
            if (!item) return;
            // Si c'était un message Client, on le remet dans rbm_messages, sinon dans rbm_commandes
            if (item.dossier === "client") {
                let msgs = [];
                try { msgs = JSON.parse(localStorage.getItem("rbm_messages") || "[]"); } catch (e) { msgs = []; }
                let original = item.original || item;
                delete original.dateSuppression; delete original.dossier;
                msgs.push(original);
                localStorage.setItem("rbm_messages", JSON.stringify(msgs));
            } else {
                let commandes = [];
                try { commandes = JSON.parse(localStorage.getItem("rbm_commandes") || "[]"); } catch (e) { commandes = []; }
                let original = item.original || item;
                delete original.dateSuppression; delete original.dossier;
                commandes.push(original);
                localStorage.setItem("rbm_commandes", JSON.stringify(commandes));
            }
            tous.splice(idx, 1);
            setCorbeille(tous);
            document.getElementById("msgInfo").textContent = "Restauré.";
            afficher();
        }
        function supprimerDefinitif(idx) {
            if (!confirm("Supprimer définitivement ? Impossible de récupérer.")) return;
            let tous = getCorbeille();
            tous.splice(idx, 1);
            setCorbeille(tous);
            document.getElementById("msgInfo").textContent = "Supprimé définitivement.";
            afficher();
        }
        function viderCorbeille() {
            let tous = getCorbeille();
            if (tous.length === 0) { document.getElementById("msgInfo").textContent = "Corbeille déjà vide."; return; }
            if (!confirm("Vider TOUTE la corbeille ? " + tous.length + " éléments supprimés définitivement.")) return;
            setCorbeille([]);
            document.getElementById("msgInfo").textContent = "Corbeille vidée.";
            afficher();
        }
    </script>
</body>

</html>
