<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notifications Paiements</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Arial,sans-serif}
body{background:#FFF8EE;color:#1A1512;overflow-x:hidden}
.header{background:#1A1512;color:#fff;padding:22px 20px;text-align:center}
.header h1{font-family:Georgia,serif;font-size:22px;font-weight:400}
.header p{font-size:13px;opacity:.85;margin-top:4px}
.nav{display:flex;gap:8px;flex-wrap:wrap;padding:14px 20px;justify-content:center}
.nav a{background:#fff;border:1px solid #F1E3C8;padding:9px 14px;border-radius:20px;text-decoration:none;color:#1A1512;font-size:13px;font-weight:700;white-space:nowrap}
.main{max-width:900px;margin:0 auto;padding:0 16px 30px}
.card{background:#fff;border:1px solid #F1E3C8;border-radius:16px;padding:18px;margin-top:14px}
.card h3{font-family:Georgia,serif;font-weight:400;font-size:22px}
.notif{display:flex;gap:14px;align-items:flex-start;padding:16px 0;border-bottom:1px solid #F1E3C8}
.notif img{width:90px;height:90px;object-fit:cover;border-radius:14px;flex-shrink:0;background:#eee}
.notif b{font-size:15px}
.notif p{font-size:13px;color:#333;margin-top:4px;line-height:1.6}
.badge{background:#1B6B2E;color:#fff;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:800;white-space:nowrap}
.btn{border:none;padding:13px;border-radius:12px;font-weight:800;cursor:pointer;font-size:14px;width:100%;margin-top:10px}
.btn-bordeaux{background:#fff;color:#7A0C1A;border:1.5px solid #7A0C1A}
.btn-noir{background:#1A1512;color:#fff}
.btn-marron{background:#7A0C1A;color:#fff}
.vide{text-align:center;color:#888;font-size:14px;padding:20px}
@media print{ .nav,.btn{ display:none!important } }
</style>
</head>
<body>
<div class="header"><h1>Notifications Paiements — LAIT KOUNDAR</h1><p>Paiements de tes clients. Coche pour supprimer.</p></div>
<div class="nav">
<a href="dashboard.html">Tableau de bord</a>
<a href="historique.html">Commandes</a>
<a href="notification-paiement.html">Notifications Paiements</a>
<a href="notification-commande.html">Notifications Commandes</a>
<a href="rapport-mois.html">Rapport du Mois</a>
<a href="corbeille.html">🗑 Corbeille</a>
</div>
<div class="main">
<div class="card">
<h3>Notifications</h3>
<div id="liste"></div>
<div id="vide" class="vide" style="display:none">Aucune notification pour le moment.</div>
<button class="btn btn-bordeaux" onclick="supprimerSelection()">🗑 Supprimer le message sélectionné</button>
<button class="btn btn-marron" onclick="supprimerTout()">🗑 Supprimer tout</button>
<button class="btn btn-noir" onclick="window.print()">🖨 IMPRIMER</button>
</div>
</div>
<script>
var VRAIES = [
  {client:"Dyjo Diakité", telephone:"+223 75 79 89 09", quartier:"Magnambougou", restaurant:"LAIT KOUNDAR", plat:"Smoothie", quantite:3, total:3500, paiement:"Payé", livree:true, statut:"Livrée", date:"18/11/2026 16:20:57"},
  {client:"Dyjo Diakité", telephone:"+223 75 79 89 09", quartier:"Magnambougou", restaurant:"LAIT KOUNDAR", plat:"Café koundar", quantite:1, total:1000, paiement:"Payé", livree:true, statut:"Livrée", date:"18/11/2026 15:55:38"}
];
function trouverPhotoDansObjet(obj, nomCherche, dejaVu){
  if(!obj || typeof obj !== "object") return "";
  if(dejaVu.has(obj)) return "";
  dejaVu.add(obj);
  if(Array.isArray(obj)){
    for(var i=0;i<obj.length;i++){ var r = trouverPhotoDansObjet(obj[i], nomCherche, dejaVu); if(r) return r; }
    return "";
  }
  var nom = String(obj.nom || obj.name || obj.plat || obj.titre || "").toLowerCase().trim();
  if(nom && nom === nomCherche){
    var ph = obj.photo || obj.image || obj.img || obj.photo_url || obj.image_url || obj.src || "";
    if(ph && typeof ph === "string" && (ph.indexOf("http")===0 || ph.indexOf("data:image")===0 || ph.indexOf("/")===0)) return ph;
  }

  var cles = Object.keys(obj);
  for(var k=0;k<cles.length;k++){
    var r2 = trouverPhotoDansObjet(obj[cles[k]], nomCherche, dejaVu);
    if(r2) return r2;
  }
  return "";
}
function photoPour(nomPlat, commande){
  if(commande && (commande.photo || commande.image || commande.img)) return commande.photo || commande.image || commande.img;
  var nomCherche = String(nomPlat||"").toLowerCase().trim();
  for(var i=0;i<localStorage.length;i++){
    var cle = localStorage.key(i);
    if(cle === "rbm_commandes") continue;
    try{
      var val = localStorage.getItem(cle);
      if(!val) continue;
      if(val.indexOf("data:image")===0 && cle.toLowerCase().indexOf(nomCherche)!==-1) return val;
      var data = JSON.parse(val);
      var r = trouverPhotoDansObjet(data, nomCherche, new Set());
      if(r) return r;
    }catch(e){}
  }
  return "";
}
function lire(){
  var a = [];
  try{ a = JSON.parse(localStorage.getItem("rbm_commandes") || "[]"); }catch(e){ a = []; }
  if(!a || a.length === 0) a = VRAIES;
  return a.filter(function(c){ return (parseInt(c.total||c.prix||0)||0) > 0; });
}
function afficher(){
  var liste = lire();
  var div = document.getElementById("liste");
  var vide = document.getElementById("vide");
  if(liste.length === 0){ div.innerHTML=""; vide.style.display="block"; return; }
  vide.style.display="none";
  div.innerHTML = liste.map(function(c, i){
    var photo = photoPour(c.plat || c.commande, c);
    var imgHtml = photo ? '<img src="'+photo+'">' : '<div style="width:90px;height:90px;background:#F1E3C8;border-radius:14px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;color:#888;text-align:center">Photo<br>Mon Menu</div>';
    return '<div class="notif"><input type="checkbox" data-i="'+i+'" style="width:20px;height:20px;margin-top:30px">'+imgHtml+'<div><b>'+(c.client||"")+' — '+(c.plat||c.commande)+' x '+(c.quantite||1)+' — </b> <span class="badge">Paiement reçu</span><p>Montant : <b>'+(c.total||c.prix)+' F</b> — Tél : '+(c.telephone||c.tel||"")+' — Quartier : '+(c.quartier||"")+'<br>Date : '+(c.date||"")+' — Statut : '+(c.statut||"Livrée")+'</p></div></div>';
  }).join("");
}
afficher();
function supprimerSelection(){
  var checks = document.querySelectorAll('#liste input[type="checkbox"]:checked');
  if(checks.length === 0){ alert("Coche d'abord une notification."); return; }
  if(!confirm("Envoyer en Corbeille ?")) return;
  var liste = lire();
  var aGarder = liste.filter(function(c, i){
    var coche = false;
    checks.forEach(function(ch){ if(parseInt(ch.getAttribute("data-i")) === i) coche = true; });
    return !coche;
  });
  localStorage.setItem("rbm_commandes", JSON.stringify(aGarder));
  afficher();
}
function supprimerTout(){ if(!confirm("Envoyer toutes les notifications en Corbeille ?")) return; localStorage.setItem("rbm_commandes", JSON.stringify([])); afficher(); }
</script>
</body>
</html>
