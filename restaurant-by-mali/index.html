<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant By Mali</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Arial, sans-serif
        }

        body {
            background: #1A1512;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px
        }

        .box {
            max-width: 480px;
            width: 100%;
            text-align: center
        }

        h1 {
            font-family: Georgia, serif;
            font-size: 34px;
            font-weight: 400
        }

        h1 span {
            color: #C9A227
        }

        p {
            opacity: .7;
            font-size: 14px;
            margin: 10px 0 24px
        }

        a {
            display: block;
            background: #C9A227;
            color: #1A1512;
            text-decoration: none;
            padding: 16px;
            border-radius: 14px;
            font-weight: 800;
            margin-top: 12px;
            font-size: 16px
        }

        a.blanc {
            background: #fff;
            color: #1A1512
        }

        a.noir {
            background: #000;
            color: #fff;
            border: 1px solid #333
        }
    </style>
</head>

<body>
    <div class="box">
        <h1>Restaurant <span>By Mali</span></h1>
        <p>Choisis ton espace</p>
        <a href="Client/login.html">👤 Je suis Client</a>
        <a href="Restaurant/login.html" class="blanc">🍽 Je suis Restaurant</a>
        <a href="Admin/dashboard.html" class="noir">🔒 Je suis Admin</a>
    </div>
</body>

</html>
